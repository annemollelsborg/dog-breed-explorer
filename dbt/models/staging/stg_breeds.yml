version: 2

models:
  - name: stg_breeds
    description: One row per breed, cleaned and typed from the raw Dog API payload.
    columns:
      - name: breed_id
        description: Unique identifier for the breed.
        tests:
          - not_null
          - unique
      - name: name
        description: Breed name.
        tests:
          - not_null

  - name: stg_breed_temperaments
    description: One row per breed per temperament trait, exploded from the comma-separated temperament list.
