version: 2

models:
  - name: stg_breeds
    description: One row per breed, cleaned and typed from the raw Dog API payload.
    columns:
      - name: breed_id
        description: Unique identifier for the breed.
        tests:
          - not_null
          - unique
      - name: name
        description: Breed name.
        tests:
          - not_null
      - name: breed_group
        description: Breed group, if known.
      - name: origin
        description: Country or region of origin, if known.
      - name: bred_for
        description: Original purpose the breed was bred for, if known.
      - name: temperament
        description: Comma-separated list of temperament traits, as returned by the API.
      - name: life_span_min_years
        description: Lower bound of predicted life span, parsed from the raw text range.
      - name: life_span_max_years
        description: Upper bound of predicted life span, parsed from the raw text range.
      - name: weight_min_kg
        description: Lower bound of adult weight in kg, parsed from the raw (sometimes gendered) text range.
      - name: weight_max_kg
        description: Upper bound of adult weight in kg, parsed from the raw (sometimes gendered) text range.
      - name: loaded_at
        description: Timestamp of the source ingestion run this record came from.

  - name: stg_breed_temperaments
    description: One row per breed per temperament trait, exploded from the comma-separated temperament list.
    columns:
      - name: breed_id
        description: Unique identifier for the breed.
      - name: name
        description: Breed name.
      - name: temperament_trait
        description: A single temperament trait (lowercased, trimmed).
